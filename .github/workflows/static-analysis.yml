name: Static Analysis

on: [push, pull_request]

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # the rules of Nette need PHP 8.1, so they are not among the dependencies of a package for PHP 7.4
      - run: composer require --dev --no-interaction --no-progress nette/phpstan-rules
      - run: vendor/bin/phpstan analyse -c .github/phpstan.neon

  lint:
    name: Syntax of PHP 7.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      # PHPStan reads the code with the parser of the PHP it runs on, so it accepts newer syntax
      - run: find src bin tests -type f \( -name '*.php' -o -name '*.phpt' -o -name lupa \) -print0 | xargs -0 -n1 php -l
